# ---- which data source feeds the system -------------------------------
# fake   : simulator (UI development)               -> badge SIMULATED
# replay : replays a recorded dataset CSV           -> badge REPLAY
# serial : ESP32 streaming CSV lines over USB       -> badge LIVE
# live   : Pi reads sensors itself (hardware/sensors.py) -> badge LIVE
source: fake

db_path: data/app.db
runs_dir: data/runs
tick_s: 1.0
speed: 1.0            # fake/replay only. 20 = 20x faster than real time (testing)
demo_timers: true     # show "shortened timers" on the dashboard when true
retention_hours: 24

timers_demo: {warmup_s: 20, run_on_s: 20, cap_s: 120, cooldown_s: 15, clear_hold_s: 5, debounce: 3, fault_clear_s: 5}
timers_real: {warmup_s: 300, run_on_s: 300, cap_s: 1800, cooldown_s: 120, clear_hold_s: 30, debounce: 3, fault_clear_s: 10}

# rise above baseline that counts as a trigger (units follow the sensor values)
thresholds: {mq135: 0.25, mq2: 0.25, humidity: 8.0, temp_c: 4.0}
clear_ratio: 0.5      # air is "clear" when every rise is below clear_ratio * threshold
pir_scale: 0.85       # PIR presence makes triggers slightly more sensitive
baseline: {alpha: 0.02, alpha_fast: 0.1, max_freeze_s: 600}
ml: {min_confidence: 0.7, threshold_scale: 0.7, model_path: ml/model/model.joblib}

fake: {scenario: cycle, seed: 7}   # cycle | clean | steam | cooking | foul | fault
serial: {port: /dev/ttyUSB0, baud: 115200, stale_s: 3}
# serial line from the ESP32, one per second:  mq135,mq2,humidity,temp_c,pir,override
replay:
  file: data/replay.csv
  loop: true
  columns: {mq135: mq135, mq2: mq2, humidity: humidity, temp_c: temp_c, pir: pir, label: label}
